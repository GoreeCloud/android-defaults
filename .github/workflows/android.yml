name: Android Clock CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests, debug build, Android lint
        run: gradle :clock:testDebugUnitTest :clock:assembleDebug :clock:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: goreecloud-clock-debug-apk
          path: clock/build/outputs/apk/debug/clock-debug.apk
          if-no-files-found: error
          retention-days: 7
