name: Android Clock CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Verified upstream commit (checkout v7.0.1), never a mutable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # setup-java v6 (v1-v4 deprecated), exact upstream commit.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      # setup-gradle v6.4.1, dereferenced annotated Git tag to commit.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '9.5.0'
      - name: Verify CI action references are commit-pinned
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/android.yml").read_text()
          refs = re.findall(r"^\s*-\s*uses:\s*([^\s#]+)", workflow, re.MULTILINE)
          if len(refs) != 4:
              raise SystemExit(f"Expected four reviewed vendor actions, found {len(refs)}")
          for ref in refs:
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}", ref):
                  raise SystemExit(f"Unpinned or unexpected GitHub Action: {ref}")
          print("All four reviewed vendor actions pinned to exact 40-character commits.")
          PY
      - name: Validate GoreeShield backup and transfer exclusion policy
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("clock/src/main")
          android = "{http://schemas.android.com/apk/res/android}"
          app = ET.parse(root / "AndroidManifest.xml").getroot().find("application")
          assert app is not None
          assert app.get(android + "allowBackup") == "false"
          assert app.get(android + "fullBackupContent") == "@xml/backup_rules"
          assert app.get(android + "dataExtractionRules") == "@xml/data_extraction_rules"

          required = {("root", "."), ("device_root", "."), ("external", ".")}
          def exclusions(element):
              return {(e.get("domain"), e.get("path")) for e in element.findall("exclude")}

          modern = ET.parse(root / "res/xml/data_extraction_rules.xml").getroot()
          assert modern.tag == "data-extraction-rules"
          for section in ("cloud-backup", "device-transfer"):
              node = modern.find(section)
              assert node is not None and required <= exclusions(node), section
          old = ET.parse(root / "res/xml/backup_rules.xml").getroot()
          assert old.tag == "full-backup-content"
          assert required <= exclusions(old), "legacy full backup"
          print("Verified explicit cloud, device-transfer, legacy backup exclusions.")
          PY
      - name: Unit tests, debug build, Android lint
        run: gradle :clock:testDebugUnitTest :clock:assembleDebug :clock:lintDebug --no-daemon --stacktrace
      - name: Verify APK package, API level and privacy permissions
        shell: bash
        run: |
          set -euo pipefail
          apk="clock/build/outputs/apk/debug/clock-debug.apk"
          test -f "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt" && test -x "$aapt"
          badging="$("$aapt" dump badging "$apk")"
          permissions="$("$aapt" dump permissions "$apk")"
          grep -Fq "package: name='com.goreecloud.clock'" <<< "$badging"
          grep -Fq "sdkVersion:'26'" <<< "$badging"
          grep -Fq "targetSdkVersion:'35'" <<< "$badging"
          if grep -Eq "uses-permission: name='android.permission.(INTERNET|READ_CONTACTS|QUERY_ALL_PACKAGES)'" <<< "$permissions"; then
            echo "Unexpected sensitive Android permission in merged APK" >&2
            exit 1
          fi
          # Inspect the merged binary manifest, not only the checked-in source.
          # The boot/time/permission receiver must not accept arbitrary app broadcasts.
          manifest="$("$aapt" dump xmltree "$apk" AndroidManifest.xml)"
          for receiver in com.goreecloud.clock.alarms.AlarmReceiver com.goreecloud.clock.alarms.RescheduleReceiver; do
            if ! printf '%s\n' "$manifest" | awk -v receiver="$receiver" '
              /A: android:name/ && index($0, "\"" receiver "\"") {
                found = 1
                if (getline > 0 && /A: android:exported/ && /0x0$/) safe = 1
              }
              END { if (!found || !safe) exit 1 }
            '; then
              echo "Missing or exported internal receiver: $receiver" >&2
              exit 1
            fi
          done
          # Explicit extraction rules are required: allowBackup=false alone does
          # not disable device-to-device transfers on all Android 12+ devices.
          grep -Fq "android:allowBackup" <<< "$manifest"
          grep -Fq "android:fullBackupContent" <<< "$manifest"
          grep -Fq "android:dataExtractionRules" <<< "$manifest"
          extraction="$("$aapt" dump xmltree "$apk" res/xml/data_extraction_rules.xml)"
          grep -Fq "E: cloud-backup" <<< "$extraction"
          grep -Fq "E: device-transfer" <<< "$extraction"
          "$aapt" dump xmltree "$apk" res/xml/backup_rules.xml > /dev/null
          echo "Clock APK identity, platform support, private receivers, offline permissions, and extraction rules verified."
      # upload-artifact v7.0.2, exact upstream commit; retain ZIP only as
      # internal CI transport (the delivered installation file is standalone).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: goreecloud-clock-debug-apk
          path: clock/build/outputs/apk/debug/clock-debug.apk
          if-no-files-found: error
          retention-days: 7
          archive: true
